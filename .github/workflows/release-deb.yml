name: release-deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v3.3.6-http-pac-routing)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-deb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev file

      - name: Build fully static binaries (musl)
        # docker/static/Dockerfile runs unit/vendor tests and TCP/UDP interop
        # checks inside the build; the artifacts stage exports bin/ and licenses.
        run: |
          docker build -f docker/static/Dockerfile \
            --target artifacts --output type=local,dest=static-out .

      - name: Check binaries are fully static
        run: |
          for b in static-out/bin/ss-*; do
            file "$b"
            if readelf -l "$b" | grep -q INTERP; then echo "$b has an interpreter" >&2; exit 1; fi
            if readelf -d "$b" | grep -q NEEDED; then echo "$b has NEEDED entries" >&2; exit 1; fi
          done

      - name: Build .deb
        env:
          BIN_DIR: static-out/bin
        run: bash scripts/build_custom_deb.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-c-deb
          path: dist/
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes "Automated build for ${RELEASE_TAG#v}. Fully static (musl) x86_64 binaries: the .deb has no libc6 or third-party library dependencies and runs on any Debian-family release; verify with SHA256SUMS."
          fi
