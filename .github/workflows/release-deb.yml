name: release-deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v3.3.6-http-pac-routing)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-deb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Build .deb
        run: bash scripts/build_custom_deb.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-c-deb
          path: dist/
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes "Automated build for ${RELEASE_TAG#v}. Includes the .deb package and Linux x86_64 binaries; verify with SHA256SUMS."
          fi
